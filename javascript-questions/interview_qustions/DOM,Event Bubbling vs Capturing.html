<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
<style>
    body{
        background-color: rgb(39, 39, 39);
        margin: 50px auto;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    #grandparent{
        display: flex;
        align-items: center;
        justify-content: center;
        height: 400px;
        width: 400px;
        background-color: royalblue;
    }

    #parent{
        display: flex;
        align-items: center;
        justify-content: center;
        border: none;
        height: 320px;
        width: 320px;
        background-color: rgb(225, 150, 65);
    }
    
     #child{
        height: 200px;
        width: 200px;
        background-color: rgb(70, 225, 65);
    }
    
</style>

</head>

<body>

    <div id="grandparent">
        <div id="parent">
            <button id="child">Click Me</button>
        </div>
    </div>

    <script>

        document.getElementById('grandparent').addEventListener('click', () => {
            console.log('Grandparent');
        }, true);

        document.getElementById('parent').addEventListener('click', () => {
            console.log('Parent');
        },false );

        document.getElementById('child').addEventListener('click', () => {
            console.log('Child');
        },);
         //Grandparent
         //Child
         //Parent
    </script>
</body>

</html>
