<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sasta Calculetor</title>
</head>
<style>
    body {
        background-color: rgb(32, 32, 32);
    }
</style>

<body>



</body>
<script>

  const sastaCalculator = () => {

    let keepRunning = true;

    const operations = {
        '1': { symbol: '+', compute: (a, b) => a + b },
        '2': { symbol: '-', compute: (a, b) => a - b },
        '3': { symbol: '*', compute: (a, b) => a * b },
        '4': { 
            symbol: '/', 
            compute: (a, b) => b === 0 ? 'Cannot divide by zero!' : a / b 
        }
    };

    while (keepRunning) {
        const choice = prompt(
            'Choose an operation:\n1: Addition (+)\n2: Subtraction (-)\n3: Multiplication (*)\n4: Division (/)'
        );

        if (choice === null) {
            alert('Thanks for using Sasta Calculator!');
            break; 
        }

        const operation = operations[choice];

        if (!operation) {
            alert('Invalid option selected!');
            continue; 
        }

        const input1 = prompt('Enter your First Value:');
        if (input1 === null) break;

        const input2 = prompt('Enter your Second Value:');
        if (input2 === null) break;

        if (input1.trim() === '' || input2.trim() === '') {
            alert('Please enter valid numbers!');
            continue;
        }

        const value1 = Number(input1);
        const value2 = Number(input2);

        if (isNaN(value1) || isNaN(value2)) {
            alert('Please enter valid numbers!');
            continue;
        }

        const result = operation.compute(value1, value2);
        
        const resultMessage = typeof result === 'string' 
            ? result 
            : `${value1} ${operation.symbol} ${value2} = ${result}`;

        alert(`Your Calculation:\n${resultMessage}`);

        keepRunning = confirm('Do you want to perform another calculation?');
    }

    if (keepRunning === false) {
        alert('Thank you!');
    }
};

sastaCalculator();


</script>

</html>
